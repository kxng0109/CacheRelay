name: CI Backend

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  lint-workflows:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install actionlint (attestation-verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo rhysd/actionlint v1.7.12 \
            --pattern '*_linux_amd64.tar.gz' --dir /tmp/actionlint
          gh attestation verify -R rhysd/actionlint \
            /tmp/actionlint/actionlint_1.7.12_linux_amd64.tar.gz
          tar xf /tmp/actionlint/actionlint_1.7.12_linux_amd64.tar.gz \
            -C /tmp/actionlint
          chmod +x /tmp/actionlint/actionlint

      - name: Lint workflow files
        run: /tmp/actionlint/actionlint -color

      - name: Verify pinned action SHAs resolve
        # actionlint cannot validate SHA existence (its PopularActions map is
        # tag-based), so this sweep fails the build on dead pins like the
        # previously unresolvable codecov SHA.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r spec; do
            ref="${spec%@*}"
            sha="${spec#*@}"
            # Subpath actions ({owner}/{repo}/{path}@{ref} per the workflow
            # syntax) resolve to a commit of owner/repo: the API repo is
            # always the first two path segments, never the action subpath.
            owner="${ref%%/*}"
            second="${ref#*/}"
            second="${second%%/*}"
            repo="${owner}/${second}"
            if resolved="$(gh api "repos/${repo}/commits/${sha}" --jq .sha 2>/dev/null)"; then
              if [ "${resolved}" = "${sha}" ]; then
                echo "OK ${spec}"
              else
                echo "::error::SHA mismatch for ${spec} (resolved ${resolved})"
                fail=1
              fi
            else
              echo "::error::Unresolvable action pin ${spec}"
              fail=1
            fi
          done < <(grep -rhoE '[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+@[0-9a-f]{40}' .github/workflows/ | sort -u)
          exit "${fail}"

  commitlint:
    name: Validate commit messages
    # Non-advisory quality gate: bad commit messages fail the build. The
    # previous wagoid/commitlint-github-action@v6 was abandoned (last code
    # change 2025-01-14) and crashes on tag-push events because it dereferences
    # payload.pull_request.commits_url, which is undefined for tag pushes.
    # Replaced with the official npx commitlint pattern + a committed
    # package-lock.json so `npm ci` is deterministic and network-free at lint
    # time. The all-zeros `before` SHA (first push of a new branch) is
    # guarded so commitlint falls back to --last instead of failing on an
    # invalid range.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install commitlint (lockfile-pinned, deterministic)
        run: npm ci

      - name: Lint commit messages
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            npx --no-install commitlint --last --verbose
          elif git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            npx --no-install commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
          else
            echo "::warning::push-base missing after a history rewrite; linting HEAD only"
            npx --no-install commitlint --last --verbose
          fi

  build:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make the Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Compile, test and package with coverage gate
        working-directory: backend
        run: ./mvnw -B -ntp clean verify

      - name: Summarize test results
        if: always()
        run: |
          {
            echo "### Test summary"
            if compgen -G "backend/target/surefire-reports/*.txt" > /dev/null; then
              grep -h -E "Tests run:" backend/target/surefire-reports/*.txt \
                | awk -F'[:,]+' '{t+=$2; f+=$4; e+=$6; s+=$8} \
                   END {printf "Tests run: %d, Failures: %d, Errors: %d, Skipped: %d\n", t, f, e, s}'
            else
              echo "No surefire reports were produced."
            fi
            echo "The JaCoCo execution report is attached as the jacoco-report artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo coverage report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

      - name: Upload application jar
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cacherelay-jar
          path: |
            backend/target/*.jar
            !backend/target/*.jar.original
          if-no-files-found: warn

      - name: Check for a Codecov token
        id: codecov-token
        if: success()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "${CODECOV_TOKEN}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        if: ${{ steps.codecov-token.outputs.run == 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Scan dependencies for known vulnerabilities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        working-directory: backend
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "NVD_API_KEY is not configured; skipping the dependency scan."
            exit 0
          fi
          ./mvnw -B -ntp org.owasp:dependency-check-maven:13.0.0:check \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML,SARIF

  timing-gate:
    name: Guardrail timing gate (isolated runner)
    # The adversarial ReDoS timing gate flakes on loaded shared runners (250 ms
    # wall-clock budgets vs vCPU contention), never from regex regressions: local
    # and isolated runs stay green while different rules trip per CI run. It runs
    # here on a fresh VM, in parallel with the suite, at full strictness — the
    # main build excludes it (see below) so suite load cannot noise-fail it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make the Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run timing gate without coverage
        working-directory: backend
        run: ./mvnw -B -ntp test -Dtest=GuardrailTimingGateTest -Djacoco.skip=true

  ops-gates:
    name: Ops config gates and image scan
    runs-on: ubuntu-latest
    # Least privilege: the SARIF upload needs security-events:write, which the
    # workflow default (contents:read) deliberately withholds. Scoped to this
    # job only; every other job keeps the restrictive default.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision local env for compose validation
        # init-env fills every hard-required secret with a local random value
        # (values never printed); without it `compose config` fails on the
        # empty shipped defaults, exactly as it would for an operator who
        # skipped the bootstrap. Invoked via sh: the script needs no exec bit.
        run: sh ./scripts/init-env.sh

      - name: Validate compose config
        run: docker compose config --quiet

      - name: promtool check config and test rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "${{ github.workspace }}/backend/monitoring/prometheus/rules:/etc/prometheus/rules:ro" \
            prom/prometheus:v3.13.3 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/backend/monitoring/prometheus/rules:/etc/prometheus/rules:ro" \
            prom/prometheus:v3.13.3 \
            test rules /etc/prometheus/rules/tests/cacherelay_alerts_test.yml

      - name: amtool check alertmanager config
        run: |
          docker run --rm --entrypoint amtool \
            -v "${{ github.workspace }}/backend/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.34.1 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Build backend image for scan
        run: docker build -t cacherelay:ci -f backend/Dockerfile .

      - name: Scan image for OS and library CVEs (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cacherelay:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # Without this the action unsets TRIVY_SEVERITY for SARIF output
          # (entrypoint.sh "Handle SARIF"), so exit-code 1 fires on ANY
          # severity including the unactionable MEDIUM/LOW base-layer noise.
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Log Trivy table for the failing image (never gates)
        # The SARIF gate above prints no finding table, so a red scan names
        # nothing in the log. This twin scan renders the same image, severities
        # and scanners to stdout for diagnosis and always succeeds.
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cacherelay:ci
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif