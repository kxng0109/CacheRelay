name: cacherelay

services:
  # ---------------------------------------------------------------------------
  # Redis 8 (Query Engine + JSON + TimeSeries built in) - ACCOUNTING TIER:
  # rate limits, budgets, holds, dedupe, circuit breakers. noeviction is a
  # correctness property here (an evicted month counter resets spend to zero),
  # never a tuning knob: size maxmemory for the accounting working set +20%.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.10.2-alpine3.23
    container_name: cacherelay-redis
    restart: unless-stopped
    # Least privilege: data dir is uid-999-owned, so the server runs as its own
    # user with a read-only rootfs (tmpfs covers /tmp); verified healthy + app probes green.
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp
    # Auth: --requirepass from REDIS_PASSWORD (hard-required, no default; generate
    # with: openssl rand -hex 32). Hex output has no spaces, so the folded command
    # string never splits the secret into extra argv words.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --maxmemory 384mb
      --maxmemory-policy noeviction
      --protected-mode no
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      # Lets the healthcheck authenticate without placing the secret on the
      # process command line (redis-cli reads REDISCLI_AUTH by default).
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
    profiles:
      - deps
      - monitoring
      - all
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - cacherelay-network

  # ---------------------------------------------------------------------------
  # Redis 8 - CACHE TIER (L1 exact, L2 vectors, replay hot): allkeys-lru so cache
  # pressure evicts only cache keys. A full tier degrades to misses, never to
  # accounting corruption. Separate persistence volume; loss is recoverable.
  # ---------------------------------------------------------------------------
  redis-cache:
    image: redis:8.10.2-alpine3.23
    container_name: cacherelay-redis-cache
    restart: unless-stopped
    # Least privilege: data dir is uid-999-owned, so the server runs as its own
    # user with a read-only rootfs (tmpfs covers /tmp); verified healthy + app probes green.
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp
    # Auth: separate credential from the accounting tier (see REDIS_PASSWORD).
    # Generate with: openssl rand -hex 32.
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --protected-mode no
      --requirepass ${REDIS_CACHE_PASSWORD:?set REDIS_CACHE_PASSWORD in .env}
    environment:
      # Lets the healthcheck authenticate without placing the secret on the
      # process command line (redis-cli reads REDISCLI_AUTH by default).
      REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD:?set REDIS_CACHE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_CACHE_PORT:-6380}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis_cache_data:/data
    profiles:
      - deps
      - monitoring
      - all
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 640M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - cacherelay-network

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 - Usage & Cost Ledger and Model Pricing Catalog
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine
    container_name: cacherelay-postgres
    restart: unless-stopped
    # Least privilege: the data dir is uid-70-owned from init, so the server runs
    # as its own user. No read_only: the socket dir lives on the rootfs (verified
    # healthy + app probes green).
    user: "70:70"
    # pg_stat_statements needs shared_preload_libraries (restart to apply);
    # track_io_timing reloads live but rides along. Scrape via postgres-exporter.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "track_io_timing=on"
      # Explicit connection ceiling with documented headroom math (5 app instances):
      # 5 x Hikari max 10 = 50 app + ~5 exporter/flyway/admin + margin << 200.
      # Raise per-instance pools or instance count only after re-running this sum.
      - "-c"
      - "max_connections=200"
      # Explicit scram-sha-256 (the PG14+ default, pinned so a base-image change
      # can never silently downgrade stored credentials to md5).
      - "-c"
      - "password_encryption=scram-sha-256"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cacherelay}
      POSTGRES_USER: ${POSTGRES_USER:-cacherelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Passthrough ONLY so one-off admin exec can reference the exporter
      # credentials without values ever leaving the container. Ignored by PG.
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:-cacherelay_exporter}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?set POSTGRES_EXPORTER_PASSWORD in .env}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cacherelay} -d $${POSTGRES_DB:-cacherelay}" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    profiles:
      - deps
      - monitoring
      - all
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - cacherelay-network

  # ---------------------------------------------------------------------------
  # CacheRelay - Reverse Proxy, Token Bucket Rate Limiter, Resilient Router
  # ---------------------------------------------------------------------------
  cacherelay:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cacherelay:latest
    container_name: cacherelay-app
    restart: unless-stopped
    # Least privilege: image already runs as uid 10001; read-only rootfs with
    # tmpfs /tmp (jar extraction, Tomcat work). File fallbacks (ledger
    # dead-letter under logs/) stay best-effort by design: failures log and
    # degrade, never break requests (verified healthy + probes green).
    read_only: true
    tmpfs:
      - /tmp
    # File descriptors must cover concurrent streams + Redis/PG/upstream sockets.
    # Plain integers: Compose schema-types ulimits as integers, so ${}-interpolated
    # strings fail validation at deploy. Tune by editing these two numbers.
    ulimits:
      nofile:
        soft: 65536
        hard: 100000
    ports:
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
      # SEC-15: actuator (health + prometheus) lives on a dedicated management port,
      # published on loopback ONLY regardless of GATEWAY_BIND_HOST. Prometheus scrapes
      # cacherelay:9091 over the compose network; the network never reaches it.
      - "127.0.0.1:${GATEWAY_MANAGEMENT_PORT:-9091}:9091"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9091/actuator/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    environment:
      # Spring profile: default serves light/moderate load; set to
      # "high-throughput" to unlock the 100K rps / 50K-stream ceilings
      # (requires tuned Redis/Postgres/kernel/JVM per docs/high-throughput/).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      # Infrastructure Connections (matching docker network services)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
      GATEWAY_BUDGET_DETECTION_ALERTMANAGER_URL: http://alertmanager:9093
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cacherelay}
      POSTGRES_USER: ${POSTGRES_USER:-cacherelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Redis AUTH passthrough (empty default = unauthenticated, for test-only
      # stacks; the compose redis services above hard-require real secrets).
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:-}
      HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAXIMUM_POOL_SIZE:-10}
      HIKARI_MINIMUM_IDLE: ${HIKARI_MINIMUM_IDLE:-10}

      # Upstream Provider Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Local Ollama (host gateway). Containers cannot reach the host's
      # localhost:11434 directly; set OLLAMA_BASE_URL=http://host.docker.internal:11434
      # in your local .env (Ollama needs no network-access toggle; it listens on 11434).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}

      # Local self-hosted bases (host gateway: containers cannot reach the host's
      # localhost). Defaults use host.docker.internal like OLLAMA_BASE_URL so local
      # servers work out of the box; override in .env for remote targets.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-http://host.docker.internal:8081}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      AWS_BEDROCK_BASE_URL: ${AWS_BEDROCK_BASE_URL:-https://bedrock-runtime.us-east-1.amazonaws.com/openai}

      # SSRF allowlist for local development backends (exact host; see SsrfUpstreamUrlValidator).
      # Empty by default = every private target fails closed; add host.docker.internal and/or
      # localhost for local Ollama development.
      GATEWAY_DEV_ALLOW_PRIVATE_HOSTS: ${GATEWAY_DEV_ALLOW_PRIVATE_HOSTS:-}

      # Master Admin Key (for /v1/admin/** APIs). No default: the app fails fast
      # at startup when this is missing, shorter than 32 bytes, or a published
      # default. Generate with: openssl rand -base64 32. Rotate immediately if
      # the old shipped default was ever used in an environment.
      GATEWAY_ADMIN_MASTERKEY: ${GATEWAY_ADMIN_MASTERKEY:?set GATEWAY_ADMIN_MASTERKEY in .env}

      # Human-auth JWT HMAC secret. Mandatory outside the dev profile (the app
      # fails fast without a stable 32+ byte secret); dev mints an ephemeral one.
      # Generate with: openssl rand -base64 32. Rotate with session invalidation.
      GATEWAY_AUTH_JWT_SECRET: ${GATEWAY_AUTH_JWT_SECRET:-}

      # Frontend-origin base for invite links. Blank = derive from the request
      # host (correct for single-origin stacks); set to the public frontend URL
      # in split-origin deployments (e.g. Vite dev http://localhost:5173).
      GATEWAY_AUTH_INVITE_BASE_URL: ${GATEWAY_AUTH_INVITE_BASE_URL:-}

      # HITL AEAD secret (REQUIRED — the app refuses to start without 32+ bytes).
      # Generate with: openssl rand -base64 32
      GATEWAY_MCP_HITL_SECRET: ${GATEWAY_MCP_HITL_SECRET:-}

      # Capacity ceilings (defaults serve light/moderate load; raise with the
      # high-throughput profile — see docs/high-throughput/README.md)
      CACHERELAY_SSE_CAPACITY_MAX_CONNECTIONS: ${CACHERELAY_SSE_CAPACITY_MAX_CONNECTIONS:-10000}
      GATEWAY_LEDGER_EXECUTOR_CORE_POOL_SIZE: ${GATEWAY_LEDGER_EXECUTOR_CORE_POOL_SIZE:-2}
      GATEWAY_LEDGER_EXECUTOR_MAX_POOL_SIZE: ${GATEWAY_LEDGER_EXECUTOR_MAX_POOL_SIZE:-4}
      GATEWAY_LEDGER_EXECUTOR_QUEUE_CAPACITY: ${GATEWAY_LEDGER_EXECUTOR_QUEUE_CAPACITY:-1000}
      GATEWAY_RATELIMIT_KEY_CACHE_MAXIMUM_SIZE: ${GATEWAY_RATELIMIT_KEY_CACHE_MAXIMUM_SIZE:-1000}
      GATEWAY_RATELIMIT_WINDOW_MILLIS: ${GATEWAY_RATELIMIT_WINDOW_MILLIS:-60000}

      # Semantic (L2) cache embedding alias. Resolved via gateway.providers/aliases
      # like any other request; default local-embed works on the local Ollama stack.
      # Set to text-embedding-3-small (or any alias) for a different model.
      GATEWAY_CACHE_SEMANTIC_EMBEDDING_MODEL: ${GATEWAY_CACHE_SEMANTIC_EMBEDDING_MODEL:-local-embed}
      TOMCAT_MAX_CONNECTIONS: ${TOMCAT_MAX_CONNECTIONS:-}
      TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-}
      # Carrier A/B harness: JVM honors JAVA_TOOL_OPTIONS, e.g.
      # JAVA_TOOL_OPTIONS="-Djdk.virtualThreadScheduler.parallelism=8".
      # Empty default = Dockerfile flags rule (parallelism=4).
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}

      # Virtual Bootstrap Key for local testing
      GATEWAY_BOOTSTRAPKEYS_0_OWNERID: ${GATEWAY_BOOTSTRAPKEYS_0_OWNERID:-local}
      GATEWAY_BOOTSTRAPKEYS_0_OWNERUSERNAME: ${GATEWAY_BOOTSTRAPKEYS_0_OWNERUSERNAME:-}
      GATEWAY_BOOTSTRAPKEYS_0_NAME: ${GATEWAY_BOOTSTRAPKEYS_0_NAME:-local-dev}
      GATEWAY_BOOTSTRAPKEYS_0_PLAINTEXTKEY: ${GATEWAY_BOOTSTRAPKEYS_0_PLAINTEXTKEY:-gw-localdevmasterkey0123456789abcde}
      GATEWAY_BOOTSTRAPKEYS_0_RPMLIMIT: ${GATEWAY_BOOTSTRAPKEYS_0_RPMLIMIT:-120}
      GATEWAY_BOOTSTRAPKEYS_0_TPMLIMIT: ${GATEWAY_BOOTSTRAPKEYS_0_TPMLIMIT:-500000}
      GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDMODELS: ${GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDMODELS:-}
      GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDPROVIDERS: ${GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDPROVIDERS:-}

      # Load-Test Bootstrap Key (60000 RPM covers the 500 rps flood with headroom).
      # Kept separate from the 120 RPM dev key so rate-integrity stays observable.
      # Point k6 at it: $env:LOAD_KEY = "gw-0123456789abcdef0123456789abcdef"
      GATEWAY_BOOTSTRAPKEYS_1_OWNERID: ${GATEWAY_BOOTSTRAPKEYS_1_OWNERID:-load}
      GATEWAY_BOOTSTRAPKEYS_1_OWNERUSERNAME: ${GATEWAY_BOOTSTRAPKEYS_1_OWNERUSERNAME:-}
      GATEWAY_BOOTSTRAPKEYS_1_NAME: ${GATEWAY_BOOTSTRAPKEYS_1_NAME:-load-test}
      GATEWAY_BOOTSTRAPKEYS_1_PLAINTEXTKEY: ${GATEWAY_BOOTSTRAPKEYS_1_PLAINTEXTKEY:-gw-0123456789abcdef0123456789abcdef}
      GATEWAY_BOOTSTRAPKEYS_1_RPMLIMIT: ${GATEWAY_BOOTSTRAPKEYS_1_RPMLIMIT:-60000}
      GATEWAY_BOOTSTRAPKEYS_1_TPMLIMIT: ${GATEWAY_BOOTSTRAPKEYS_1_TPMLIMIT:-10000000}

      # Pricing & Ledger Settings
      GATEWAY_PRICING_URL: ${GATEWAY_PRICING_URL:-https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json}
      GATEWAY_PRICING_REFRESH_CRON: ${GATEWAY_PRICING_REFRESH_CRON:-0 0 3 * * *}
      GATEWAY_LEDGER_DEAD_LETTER_PATH: ${GATEWAY_LEDGER_DEAD_LETTER_PATH:-logs/ledger-deadletter.log}
      GATEWAY_DATABASE_MIGRATE_ENABLED: "true"
      GATEWAY_DATABASE_MIGRATE_INTERVAL: 30s
    profiles:
      - app
      - monitoring
      - all
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cacherelay-network

  # ---------------------------------------------------------------------------
  # Redis Exporter - Redis internals for Prometheus (passwordless local Redis,
  # no secrets in this file; RediSearch module + per-index metrics included,
  # config values redacted from metrics)
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.0-alpine
    container_name: cacherelay-redis-exporter
    restart: unless-stopped
    # Authenticated scrape: the exporter reads REDIS_PASSWORD natively
    # (CLI flags take precedence; none are set here by design).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - "--redis.addr=redis://redis:6379"
      - "--include-modules-metrics"
      - "--include-search-indexes-metrics"
      - "--redact-config-metrics"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - monitoring
      - all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cacherelay-network

  # ---------------------------------------------------------------------------
  # Redis Cache Exporter - cache-tier internals (evictions are normal here;
  # alert thresholds for this job must differ from the accounting tier).
  # ---------------------------------------------------------------------------
  redis-cache-exporter:
    image: oliver006/redis_exporter:v1.92.0-alpine
    container_name: cacherelay-redis-cache-exporter
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD:?set REDIS_CACHE_PASSWORD in .env}
    command:
      - "--redis.addr=redis://redis-cache:6379"
      - "--include-modules-metrics"
      - "--include-search-indexes-metrics"
      - "--redact-config-metrics"
    depends_on:
      redis-cache:
        condition: service_healthy
    profiles:
      - monitoring
      - all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cacherelay-network

  # ---------------------------------------------------------------------------
  # Postgres Exporter - Postgres internals for Prometheus. Auth via
  # POSTGRES_EXPORTER_USER/PASSWORD (least-privilege pg_monitor member, see
  # README; values live ONLY in .env, referenced here by name).
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: cacherelay-postgres-exporter
    restart: unless-stopped
    command:
      - "--collector.stat_statements"
      - "--collector.stat_activity_autovacuum"
      - "--collector.long_running_transactions"
    environment:
      # Split DSN: host/db in the URI (never credentials), auth in discrete
      # vars so the password is not baked into one interpolated connection
      # string surfaced in exporter logs and scrape debug. Full _FILE hygiene
      # (USER_FILE/PASS_FILE/URI_FILE + secrets blocks) is a follow-up — it
      # changes the .env secret workflow operator-side.
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-cacherelay}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_EXPORTER_USER:-cacherelay_exporter}"
      DATA_SOURCE_PASS: "${POSTGRES_EXPORTER_PASSWORD:?set POSTGRES_EXPORTER_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - monitoring
      - all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cacherelay-network

  # ---------------------------------------------------------------------------
  # Alertmanager v0.34.0 - Alert routing for detector alerts (gateway POSTs to
  # /api/v2/alerts; Prometheus rule alerts also land here). Replace the receiver
  # webhook URL in monitoring/alertmanager/alertmanager.yml before relying on pages.
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: cacherelay-alertmanager
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./backend/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/healthy" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    profiles:
      - monitoring
      - all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cacherelay-network

  # ---------------------------------------------------------------------------
  # Prometheus 3 - Metrics Aggregator & Alerting Engine
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: cacherelay-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=20GiB"
      - "--storage.tsdb.wal-compression"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./backend/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    profiles:
      - monitoring
      - all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cacherelay-network

  # ---------------------------------------------------------------------------
  # Grafana 11 - Operational Dashboards & Real-Time Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-enterprise:11.5.2
    container_name: cacherelay-grafana
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_AUTH_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    profiles:
      - monitoring
      - all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cacherelay-network

volumes:
  postgres_data:
    name: cacherelay_postgres_data
  redis_data:
    name: cacherelay_redis_data
  redis_cache_data:
    name: cacherelay_redis_cache_data
  alertmanager_data:
    name: cacherelay_alertmanager_data
  prometheus_data:
    name: cacherelay_prometheus_data
  grafana_data:
    name: cacherelay_grafana_data

networks:
  cacherelay-network:
    name: cacherelay_network
    driver: bridge
