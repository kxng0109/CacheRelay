apiVersion: v1
kind: Service
metadata:
  name: cacherelay
  namespace: cacherelay
  labels:
    app.kubernetes.io/name: cacherelay
spec:
  type: ClusterIP
  # Single ClusterIP (NOT headless): pods never call each other directly.
  selector:
    app.kubernetes.io/name: cacherelay
  ports:
    - name: http
      port: 8080
      targetPort: http
