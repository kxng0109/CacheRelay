# Explicit egress: DNS (mandatory under default-deny), both Redis tiers,
# PostgreSQL. Ingress: only from the ingress controller namespace.
# Adjust the ingress namespaceSelector to your controller's labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cacherelay-allow
  namespace: cacherelay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cacherelay
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
          # ingress-nginx MUST be >= 1.15.1 (CVE-2026-4342 annotation RCE).
      ports:
        - port: 8080
    # SEC-15: the actuator management port (aggregate health for probes, Prometheus
    # scrape) is cluster-internal. It is never mapped by the Service and never reachable
    # from the ingress. Restrict it to the monitoring namespace; adjust the selector to
    # your scraper's labels. Probes originate from the node, so if your CNI subjects
    # node traffic to policies, also allow the node CIDR or probe the app port instead.
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: monitoring
      ports:
        - port: 9091
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-cache
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
    # Upstream LLM providers (OpenAI/OpenRouter/Anthropic) over 443.
    - ports:
        - port: 443
          protocol: TCP
