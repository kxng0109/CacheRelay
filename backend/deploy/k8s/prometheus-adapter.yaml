# Prometheus Adapter rules serving the CacheRelay HPA (FS-B17).
#
# The HPA (hpa.yaml) scales on workload signals the app actually emits
# (see HpaMetricsFilter): admission_rps = per-second rate of
# cacherelay_admission_total, p99_latency_seconds = p99 of
# cacherelay_stream_seconds buckets. Apply alongside the adapter Helm chart
# (helm install prometheus-adapter prometheus-community/prometheus-adapter
# -f <values wiring this file under rules:>); without the adapter the HPA
# stays pending and pods hold minReplicas (fail-safe, never CrashLoop).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-rules
  namespace: cacherelay
data:
  config.yaml: |
    rules:
      - seriesQuery: 'cacherelay_admission_total{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: namespace}
            pod: {resource: pod}
        name:
          matches: "cacherelay_admission_total"
          as: "admission_rps"
        metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'
      - seriesQuery: 'cacherelay_stream_seconds_bucket{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: namespace}
            pod: {resource: pod}
        name:
          matches: "cacherelay_stream_seconds_bucket"
          as: "p99_latency_seconds"
        metricsQuery: 'histogram_quantile(0.99, sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (le, <<.GroupBy>>))'
