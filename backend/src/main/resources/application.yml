spring:
  application:
    name: CacheRelay
  threads:
    virtual:
      enabled: true
  mvc:
    # Streaming endpoints (chat SSE, A2A message/stream) hold servlet-async
    # responses open; Tomcat's 30s container default would kill long agent
    # streams with a 503. Ten minutes is the ceiling; per-request behaviour is
    # still bounded by upstream idleness and the client connection.
    async:
      request-timeout: ${GATEWAY_ASYNC_REQUEST_TIMEOUT:10m}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Accounting-tier AUTH (SEC-12): empty = unauthenticated (local dev, tests).
      # Compose injects REDIS_PASSWORD; the circuit-breaker factories already
      # apply it when non-blank.
      password: ${REDIS_PASSWORD:}
      # No Redis repositories exist by design (boot logs prove 0 Redis
      # repository interfaces): all Redis access goes through the qualified
      # templates on the custom LettuceConnectionFactory beans. Disabling the
      # repository scan silences the per-candidate "could not safely identify
      # store assignment" INFOs without touching templates or connections.
      repositories:
        enabled: false
      # No lettuce pool keys on purpose: the app defines its own
      # LettuceConnectionFactory beans, which use a single shared native
      # connection (optimal for sub-ms Lua gates). Boot's pool auto-config
      # backs off, so spring.data.redis.lettuce.pool.* would bind to nothing.
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/cacherelay}
    username: ${POSTGRES_USER:cacherelay}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # The gateway starts without PostgreSQL. The pool initializes lazily,
      # the retrying DatabaseMigrator applies the schema when the database is
      # reachable, and ledger writes degrade to warnings and the dead letter
      # file in the meantime. The hot path never depends on the database.
      initialization-fail-timeout: -1
      connection-timeout: 3000
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:10}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
  jpa:
    hibernate:
      # Flyway owns the schema (see DatabaseMigrator); Hibernate never creates
      # or validates it, so boot does not require a live database. The dialect
      # is pinned because auto detection would need a live connection.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Automatic Flyway is disabled; DatabaseMigrator runs the same migrations
    # non-fatally and retries until the database is reachable.
    enabled: false
  # Human-auth SSO is registered programmatically (see SsoRegistrationConfig): every
  # IdP below activates the moment its SSO_* client id (and secret) is supplied, and
  # blank stays inert. Static spring.security.oauth2.client blocks are deliberately
  # absent — Boot fails startup on blank client-ids, so registrations are built only
  # for configured providers. Supported day one: google, github, azure (Entra ID),
  # azure-b2c, okta, generic (explicit endpoint URIs, no boot-time discovery calls).
  # Team provisioning is claim-mapped per registration id (see SsoClaimProperties):
  # GATEWAY_SSO_TEAMS_REGISTRATIONS_<n>_REGISTRATIONID plus ORGSLUG, GROUPSCLAIM,
  # ROLESCLAIM, TENANTCLAIM, ALLOWEDTENANTS_<i>, GROUPPATTERNS_<i>. Registrations
  # without an entry keep legacy shadow accounts with no teams. First-login backfill
  # (IdP group APIs for claims that cannot carry membership) is wired per registration id:
  # GATEWAY_SSO_BACKFILL_REGISTRATIONS_<n>_REGISTRATIONID plus MODE (ENTRA_GRAPH, OKTA_API,
  # GOOGLE_DIRECTORY, GITHUB_API) and APISCOPE, with mode credentials from SSO_* /
  # GATEWAY_SSO_OKTA_PRIVATE_KEY (+_KEY_ID) / GATEWAY_SSO_GOOGLE_SERVICE_ACCOUNT_JSON
  # (+_ADMIN_SUBJECT); misconfiguration fails startup, backfill failures deny first logins.
  # Revalidation sweeps re-check known SSO accounts at the IdP on two ShedLock single-holder
  # cadences and revoke on positive disabled signals only (transport failures never revoke):
  # GATEWAY_SSO_REVALIDATION_ENABLED, _HOTCRON, _COLDCRON, _BATCHSIZE, _HOTSTALEMINUTES,
  # _COLDSTALEHOURS.

gateway:
  admin:
    # Master admin key — injected exclusively from the runtime environment.
    # NEVER hardcode a value here. Generate with: openssl rand -base64 32
    # Required: GATEWAY_ADMIN_MASTERKEY=<32+ byte secret, not a published default>
    # The application refuses to start if this is absent, blank, shorter than
    # 32 bytes, or equal to a known default (e.g. cacherelay_admin_secret_key).
    master-key: ${GATEWAY_ADMIN_MASTERKEY:}
  auth:
    # Human authentication lifetimes: relaxed defaults, strict admin counterparts.
    access-ttl: ${GATEWAY_AUTH_ACCESS_TTL:10m}
    admin-access-ttl: ${GATEWAY_AUTH_ADMIN_ACCESS_TTL:5m}
    refresh-ttl: ${GATEWAY_AUTH_REFRESH_TTL:14d}
    admin-refresh-ttl: ${GATEWAY_AUTH_ADMIN_REFRESH_TTL:7d}
    absolute-max-ttl: ${GATEWAY_AUTH_ABSOLUTE_MAX_TTL:30d}
    admin-absolute-max-ttl: ${GATEWAY_AUTH_ADMIN_ABSOLUTE_MAX_TTL:7d}
    invite-ttl: ${GATEWAY_AUTH_INVITE_TTL:48h}
    # Frontend-origin base URL for invite links (blank = derive from the request
    # host). Set GATEWAY_AUTH_INVITE_BASE_URL in split-origin deployments
    # (Vite dev http://localhost:5173, prod public frontend URL).
    invite-base-url: ${GATEWAY_AUTH_INVITE_BASE_URL:}
    cookie-name: ${GATEWAY_AUTH_COOKIE_NAME:__Host-refresh}
    cookie-same-site: ${GATEWAY_AUTH_COOKIE_SAMESITE:Lax}
    jwt-issuer: ${GATEWAY_AUTH_JWT_ISSUER:cacherelay}
    # 32+ bytes; mandatory outside dev/test (startup fails without it). Blank mints an
    # ephemeral secret under dev/test only (single-instance safe, restart-invalid).
    jwt-secret: ${GATEWAY_AUTH_JWT_SECRET:}
    audit-retention-days: ${GATEWAY_AUTH_AUDIT_RETENTION_DAYS:180}
    login-max-attempts: ${GATEWAY_AUTH_LOGIN_MAX_ATTEMPTS:5}
    login-attempt-window: ${GATEWAY_AUTH_LOGIN_ATTEMPT_WINDOW:15m}
    login-lockout: ${GATEWAY_AUTH_LOGIN_LOCKOUT:30m}
  providers:
    openai:
      type: OPENAI
      base-url: https://api.openai.com
      api-key: ${OPENAI_API_KEY:}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
      request-timeout: ${OPENAI_REQUEST_TIMEOUT:60s}
    openrouter:
      type: OPENAI
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY:}
      connect-timeout: ${OPENROUTER_CONNECT_TIMEOUT:5s}
      request-timeout: ${OPENROUTER_REQUEST_TIMEOUT:60s}
    anthropic:
      type: ANTHROPIC
      base-url: https://api.anthropic.com
      api-key: ${ANTHROPIC_API_KEY:}
      connect-timeout: ${ANTHROPIC_CONNECT_TIMEOUT:5s}
      request-timeout: ${ANTHROPIC_REQUEST_TIMEOUT:60s}
    ollama:
      name: ollama
      type: OLLAMA
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      api-key: ""
      connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:3s}
      request-timeout: ${OLLAMA_REQUEST_TIMEOUT:120s}
    # Config-only OpenAI-compatible providers: zero Java, activated by setting
    # the key and referencing the name in an alias chain (see README). Unset
    # keys stay inert; nothing calls a provider until a chain references it.
    # Base URLs are prefixes: the adapter appends the chat path (default
    # /v1/chat/completions, overridable per provider via chat-completions-path
    # for odd shapes like Zhipu and DeepInfra). Never include the chat path here.
    together:
      type: OPENAI
      base-url: https://api.together.ai
      api-key: ${TOGETHER_API_KEY:}
      connect-timeout: ${TOGETHER_CONNECT_TIMEOUT:5s}
      request-timeout: ${TOGETHER_REQUEST_TIMEOUT:60s}
    groq:
      type: OPENAI
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY:}
      connect-timeout: ${GROQ_CONNECT_TIMEOUT:5s}
      request-timeout: ${GROQ_REQUEST_TIMEOUT:60s}
    mistral:
      type: OPENAI
      base-url: https://api.mistral.ai
      api-key: ${MISTRAL_API_KEY:}
      connect-timeout: ${MISTRAL_CONNECT_TIMEOUT:5s}
      request-timeout: ${MISTRAL_REQUEST_TIMEOUT:60s}
    xai:
      type: OPENAI
      base-url: https://api.x.ai
      api-key: ${XAI_API_KEY:}
      connect-timeout: ${XAI_CONNECT_TIMEOUT:5s}
      request-timeout: ${XAI_REQUEST_TIMEOUT:120s}
    deepinfra:
      type: OPENAI
      base-url: https://api.deepinfra.com
      chat-completions-path: /v1/openai/chat/completions
      api-key: ${DEEPINFRA_API_KEY:}
      connect-timeout: ${DEEPINFRA_CONNECT_TIMEOUT:5s}
      request-timeout: ${DEEPINFRA_REQUEST_TIMEOUT:60s}
    fireworks:
      type: OPENAI
      base-url: https://api.fireworks.ai/inference
      api-key: ${FIREWORKS_API_KEY:}
      connect-timeout: ${FIREWORKS_CONNECT_TIMEOUT:5s}
      request-timeout: ${FIREWORKS_REQUEST_TIMEOUT:60s}
    cerebras:
      type: OPENAI
      base-url: https://api.cerebras.ai
      api-key: ${CEREBRAS_API_KEY:}
      connect-timeout: ${CEREBRAS_CONNECT_TIMEOUT:5s}
      request-timeout: ${CEREBRAS_REQUEST_TIMEOUT:60s}
    sambanova:
      type: OPENAI
      base-url: https://api.sambanova.ai
      api-key: ${SAMBANOVA_API_KEY:}
      connect-timeout: ${SAMBANOVA_CONNECT_TIMEOUT:5s}
      request-timeout: ${SAMBANOVA_REQUEST_TIMEOUT:60s}
    nebius:
      type: OPENAI
      # AI Studio host; Token Factory keys use https://api.tokenfactory.nebius.com (key provenance decides).
      base-url: https://api.studio.nebius.com
      api-key: ${NEBIUS_API_KEY:}
      connect-timeout: ${NEBIUS_CONNECT_TIMEOUT:5s}
      request-timeout: ${NEBIUS_REQUEST_TIMEOUT:60s}
    novita:
      type: OPENAI
      base-url: https://api.novita.ai/openai
      api-key: ${NOVITA_API_KEY:}
      connect-timeout: ${NOVITA_CONNECT_TIMEOUT:5s}
      request-timeout: ${NOVITA_REQUEST_TIMEOUT:60s}
    moonshot:
      type: OPENAI
      # Global platform; China keys need https://api.moonshot.cn (keys are not interchangeable).
      base-url: https://api.moonshot.ai
      api-key: ${MOONSHOT_API_KEY:}
      connect-timeout: ${MOONSHOT_CONNECT_TIMEOUT:5s}
      request-timeout: ${MOONSHOT_REQUEST_TIMEOUT:60s}
    zhipu:
      type: OPENAI
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat-completions-path: /chat/completions
      api-key: ${ZHIPU_API_KEY:}
      connect-timeout: ${ZHIPU_CONNECT_TIMEOUT:5s}
      request-timeout: ${ZHIPU_REQUEST_TIMEOUT:60s}
    minimax:
      type: OPENAI
      # International platform; China keys use https://api.minimaxi.com.
      base-url: https://api.minimax.io
      api-key: ${MINIMAX_API_KEY:}
      connect-timeout: ${MINIMAX_CONNECT_TIMEOUT:5s}
      request-timeout: ${MINIMAX_REQUEST_TIMEOUT:60s}
    qwen:
      type: OPENAI
      # Beijing legacy default; keys are region-bound. Alternatives: Singapore/intl
      # https://dashscope-intl.aliyuncs.com/compatible-mode, Virginia
      # https://dashscope-us.aliyuncs.com/compatible-mode, or workspace-dedicated
      # https://{WorkspaceId}.{region}.maas.aliyuncs.com/compatible-mode.
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:}
      connect-timeout: ${QWEN_CONNECT_TIMEOUT:5s}
      request-timeout: ${QWEN_REQUEST_TIMEOUT:60s}
    stepfun:
      type: OPENAI
      # China platform; international keys use https://api.stepfun.ai.
      base-url: https://api.stepfun.com
      api-key: ${STEP_API_KEY:}
      connect-timeout: ${STEP_CONNECT_TIMEOUT:5s}
      request-timeout: ${STEP_REQUEST_TIMEOUT:60s}
    cloudflare:
      type: OPENAI
      base-url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:}/ai
      api-key: ${CLOUDFLARE_API_TOKEN:}
      connect-timeout: ${CLOUDFLARE_CONNECT_TIMEOUT:5s}
      request-timeout: ${CLOUDFLARE_REQUEST_TIMEOUT:60s}
    hyperbolic:
      type: OPENAI
      base-url: https://api.hyperbolic.xyz
      api-key: ${HYPERBOLIC_API_KEY:}
      connect-timeout: ${HYPERBOLIC_CONNECT_TIMEOUT:5s}
      request-timeout: ${HYPERBOLIC_REQUEST_TIMEOUT:60s}
    ionet:
      type: OPENAI
      base-url: https://api.intelligence.io.solutions/api
      api-key: ${IO_API_KEY:}
      connect-timeout: ${IO_CONNECT_TIMEOUT:5s}
      request-timeout: ${IO_REQUEST_TIMEOUT:60s}
    friendli:
      type: OPENAI
      base-url: https://api.friendli.ai/serverless
      api-key: ${FRIENDLI_API_KEY:}
      connect-timeout: ${FRIENDLI_CONNECT_TIMEOUT:5s}
      request-timeout: ${FRIENDLI_REQUEST_TIMEOUT:60s}
    bedrock:
      type: OPENAI
      # Plain Bearer works (no SigV4 needed), but the base must be explicit and regional.
      # Open-weight models only on this route (no Claude/Nova/Llama); mantle host
      # https://bedrock-mantle.{region}.api.aws/openai is the alternative.
      base-url: ${AWS_BEDROCK_BASE_URL:https://bedrock-runtime.us-east-1.amazonaws.com/openai}
      api-key: ${AWS_BEARER_TOKEN_BEDROCK:}
      connect-timeout: ${BEDROCK_CONNECT_TIMEOUT:5s}
      request-timeout: ${BEDROCK_REQUEST_TIMEOUT:60s}
    vllm:
      type: OPENAI
      base-url: ${VLLM_BASE_URL:http://localhost:8000}
      api-key: ${VLLM_API_KEY:}
      connect-timeout: ${VLLM_CONNECT_TIMEOUT:3s}
      request-timeout: ${VLLM_REQUEST_TIMEOUT:120s}
    llamacpp:
      type: OPENAI
      # Port 8081: llama-server defaults to 8080, which clashes with the gateway itself.
      base-url: ${LLAMACPP_BASE_URL:http://localhost:8081}
      api-key: ${LLAMACPP_API_KEY:}
      connect-timeout: ${LLAMACPP_CONNECT_TIMEOUT:3s}
      request-timeout: ${LLAMACPP_REQUEST_TIMEOUT:120s}
    lmstudio:
      type: OPENAI
      base-url: ${LMSTUDIO_BASE_URL:http://localhost:1234}
      api-key: ${LMSTUDIO_API_KEY:}
      connect-timeout: ${LMSTUDIO_CONNECT_TIMEOUT:3s}
      request-timeout: ${LMSTUDIO_REQUEST_TIMEOUT:120s}
  aliases:
    local-llama:
      chain:
        - provider-name: ollama
          model-override: qwen2.5:0.5b
      strategy: SEQUENTIAL
    local-embed:
      chain:
        - provider-name: ollama
          model-override: nomic-embed-text:latest
      strategy: SEQUENTIAL
  bootstrap-keys:
  # Bootstrap keys are provisioned exclusively through environment variables.
  # Example for the first key:
  #   GATEWAY_BOOTSTRAPKEYS_0_OWNERID=owner-1
  #   GATEWAY_BOOTSTRAPKEYS_0_NAME=local-dev
  #   GATEWAY_BOOTSTRAPKEYS_0_PLAINTEXTKEY=gw-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  #   GATEWAY_BOOTSTRAPKEYS_0_RPMLIMIT=60
  #   GATEWAY_BOOTSTRAPKEYS_0_TPMLIMIT=100000
  #   GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDMODELS=
  #   GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDPROVIDERS=
  #   GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDCACHESCOPES=TENANT (GLOBAL needs GATEWAY_CACHE_GLOBAL_SCOPE_ENABLED=true)
  #   GATEWAY_BOOTSTRAPKEYS_0_OWNERUSERNAME=local (owning account username; the seed is skipped
  #     with an error until the account exists, then picked up by the seed retry)
  bootstrap-keys-seed-interval: ${GATEWAY_BOOTSTRAP_KEYS_SEED_INTERVAL:30s}
  database-migrate-enabled: ${GATEWAY_DATABASE_MIGRATE_ENABLED:true}
  database-migrate-interval: ${GATEWAY_DATABASE_MIGRATE_INTERVAL:30s}
  ingress:
    # Request body cap in bytes; larger bodies are rejected with 413.
    max-body-bytes: ${GATEWAY_INGRESS_MAX_BODY_BYTES:1048576}
  proxy:
    # Shared upstream HTTP client connect timeout in seconds.
    connect-timeout-seconds: ${GATEWAY_PROXY_CONNECT_TIMEOUT_SECONDS:5}
  ratelimit:
    # Fixed-window length, token-estimate clamps, and key-resolution cache sizing.
    window-millis: ${GATEWAY_RATELIMIT_WINDOW_MILLIS:60000}
    min-estimated-tokens: ${GATEWAY_RATELIMIT_MIN_ESTIMATED_TOKENS:1}
    max-estimated-tokens: ${GATEWAY_RATELIMIT_MAX_ESTIMATED_TOKENS:1000000}
    key-cache-maximum-size: ${GATEWAY_RATELIMIT_KEY_CACHE_MAXIMUM_SIZE:1000}
    key-cache-ttl-seconds: ${GATEWAY_RATELIMIT_KEY_CACHE_TTL_SECONDS:5}
  budget:
    detection:      # Background spend watchdog (static thresholds, exhaustion forecast, anomaly): reads Redis counters
      # once a minute, writes the alert_events outbox, dispatches to Alertmanager. Empty URL = log-only.
      enabled: ${GATEWAY_BUDGET_DETECTION_ENABLED:true}
      interval: ${GATEWAY_BUDGET_DETECTION_INTERVAL:60s}
      alertmanager-url: ${GATEWAY_BUDGET_DETECTION_ALERTMANAGER_URL:}
      dispatch-batch: ${GATEWAY_BUDGET_DETECTION_DISPATCH_BATCH:100}
      dispatch-interval: ${GATEWAY_BUDGET_DETECTION_DISPATCH_INTERVAL:30s}
    settlement:
      # Hold-then-settle accounting: admission holds H, stream-end trues up to actual.
      enabled: ${GATEWAY_BUDGET_SETTLEMENT_ENABLED:true}
      max-tokens-ceiling: ${GATEWAY_BUDGET_SETTLEMENT_MAX_TOKENS_CEILING:4096}
      hold-ttl-seconds: ${GATEWAY_BUDGET_SETTLEMENT_HOLD_TTL_SECONDS:3600}
      abort-grace-seconds: ${GATEWAY_BUDGET_SETTLEMENT_ABORT_GRACE_SECONDS:30}
      sweeper-batch: ${GATEWAY_BUDGET_SETTLEMENT_SWEEPER_BATCH:500}
      sweep-interval: ${GATEWAY_BUDGET_SETTLEMENT_SWEEP_INTERVAL:30s}
  maintenance:
    # Monthly retention janitor (replay partition detach, alert archive roll, purges).
    retention-enabled: ${GATEWAY_MAINTENANCE_RETENTION_ENABLED:true}
    retention-batch: ${GATEWAY_MAINTENANCE_RETENTION_BATCH:1000}
    retention-cron: ${GATEWAY_MAINTENANCE_RETENTION_CRON:0 0 3 1 * *}
  notify:
    email:
      graph:
        # Microsoft Graph mail (application permission Mail.Send). All blank = email channel disabled.
        tenant-id: ${GATEWAY_NOTIFY_EMAIL_GRAPH_TENANT_ID:}
        client-id: ${GATEWAY_NOTIFY_EMAIL_GRAPH_CLIENT_ID:}
        secret-ref: ${GATEWAY_NOTIFY_EMAIL_GRAPH_SECRET_REF:}
        mailbox: ${GATEWAY_NOTIFY_EMAIL_GRAPH_MAILBOX:}
        per-minute-cap: ${GATEWAY_NOTIFY_EMAIL_GRAPH_PER_MINUTE_CAP:25}
  redis:
    cache:
      # Cache-tier Redis (L1/L2/replay-hot): evictable instance, best-effort by design.
      host: ${REDIS_CACHE_HOST:localhost}
      port: ${REDIS_CACHE_PORT:6380}
      # Cache-tier AUTH (SEC-12): empty = unauthenticated (local dev, tests).
      # Compose injects REDIS_CACHE_PASSWORD (a different secret from REDIS_PASSWORD).
      password: ${REDIS_CACHE_PASSWORD:}
  embeddings:
    # Embedding batching and provider fan-out ceilings.
    max-batch-items: ${GATEWAY_EMBEDDINGS_MAX_BATCH_ITEMS:2048}
    max-concurrent-sub-requests: ${GATEWAY_EMBEDDINGS_MAX_CONCURRENT_SUB_REQUESTS:4}
    # Keep-warm heartbeat: pings the resolved Ollama embeddings endpoint on a fixed
    # delay so the iGPU never reaches its deep-sleep state (measured 2026-09-16:
    # 18-33ms steady vs ~2.2s first-call wake penalty after idle). Disable on
    # battery-powered hosts. Interval (default 5s) is read by the scheduler via
    # GATEWAY_EMBEDDINGS_KEEP_WARM_INTERVAL.
    keep-warm-enabled: ${GATEWAY_EMBEDDINGS_KEEP_WARM_ENABLED:true}
    cohere:
      timeout-seconds: ${GATEWAY_EMBEDDINGS_COHERE_TIMEOUT_SECONDS:30}
      max-batch-size: ${GATEWAY_EMBEDDINGS_COHERE_MAX_BATCH_SIZE:96}
    # Opt-in in-process ONNX embedder for the L2 semantic cache path (ONNX Runtime
    # + DJL tokenizers; measured 18-33ms steady, no HTTP round-trip). Client-facing
    # /v1/embeddings always keeps the HTTP adapters. CAUTION: local scores sit ~0.03
    # cosine below Ollama GGUF (r=0.994) — re-index and recalibrate the similarity
    # threshold (0.77 local <=> 0.80 Ollama) before enabling on a populated index.
    # Model artifacts: nomic-ai/nomic-embed-text-v1 ONNX export + tokenizer.json
    # (Apache-2.0); download once and point the paths at them.
    local-onnx:
      enabled: ${GATEWAY_EMBEDDINGS_LOCAL_ONNX_ENABLED:false}
      model-path: ${GATEWAY_EMBEDDINGS_LOCAL_ONNX_MODEL_PATH:}
      tokenizer-path: ${GATEWAY_EMBEDDINGS_LOCAL_ONNX_TOKENIZER_PATH:}
      intra-op-threads: ${GATEWAY_EMBEDDINGS_LOCAL_ONNX_INTRA_OP_THREADS:2}
      max-tokens: ${GATEWAY_EMBEDDINGS_LOCAL_ONNX_MAX_TOKENS:2048}
  cache:
    # Operator-only master switch for the GLOBAL cache scope (SEC-01, default false):
    # GLOBAL requests fall back to the default scope unless this is true AND the key
    # allows GLOBAL. Cross-tenant sharing can never be enabled by client headers alone.
    # Override: GATEWAY_CACHE_GLOBAL_SCOPE_ENABLED=true
    global-scope-enabled: ${GATEWAY_CACHE_GLOBAL_SCOPE_ENABLED:false}
    # Follower wait bound for single-flight cache lookups (PERF-08, default 30s).
    # Override: GATEWAY_CACHE_SINGLE_FLIGHT_TIMEOUT=30s
    single-flight-timeout: ${GATEWAY_CACHE_SINGLE_FLIGHT_TIMEOUT:30s}
    exact:
      # L0 heap cap in bytes (PERF-11, default 256 MiB): entries are payload-weighed,
      # so huge completions cannot crowd out the heap. Override: GATEWAY_CACHE_L0_MAX_BYTES.
      l0-max-bytes: ${GATEWAY_CACHE_L0_MAX_BYTES:268435456}
    semantic:
      # Model alias used to generate embeddings for semantic (L2) cache lookups.
      # Resolved through gateway.providers/aliases like any other request, so the
      # default points at the local Ollama embedding alias and works out of the
      # box on the local stack; OpenAI users set the env var explicitly.
      # Override: GATEWAY_CACHE_SEMANTIC_EMBEDDING_MODEL=text-embedding-3-small
      embedding-model: ${GATEWAY_CACHE_SEMANTIC_EMBEDDING_MODEL:local-embed}
  pricing:
    source-url: ${GATEWAY_PRICING_URL:https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json}
    refresh-cron: ${GATEWAY_PRICING_REFRESH_CRON:0 0 3 * * *}
    fetch-timeout-seconds: ${GATEWAY_PRICING_FETCH_TIMEOUT_SECONDS:30}
    max-attempts: ${GATEWAY_PRICING_MAX_ATTEMPTS:5}
    backoff-base-seconds: ${GATEWAY_PRICING_BACKOFF_BASE_SECONDS:5}
    snapshot-ttl-minutes: ${GATEWAY_PRICING_SNAPSHOT_TTL_MINUTES:15}
    snapshot-maximum-size: ${GATEWAY_PRICING_SNAPSHOT_MAXIMUM_SIZE:1}
  ledger:
    # Durable spillway journal for ledger batches the database rejects (PERF-03: the
    # per-row dead-letter file is gone; failed batches stage shared-first, journal-second).
    dead-letter-path: ${GATEWAY_LEDGER_DEAD_LETTER_PATH:logs/ledger-deadletter.log}
    executor:
      # Bounded async ledger pool: bursts queue (then CallerRuns) instead of
      # piling unbounded work onto database writes.
      core-pool-size: ${GATEWAY_LEDGER_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${GATEWAY_LEDGER_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${GATEWAY_LEDGER_EXECUTOR_QUEUE_CAPACITY:1000}
      await-termination-seconds: ${GATEWAY_LEDGER_EXECUTOR_AWAIT_TERMINATION_SECONDS:10}
    batch:
      max-size: ${GATEWAY_LEDGER_BATCH_MAX_SIZE:5000}
      interval-ms: ${GATEWAY_LEDGER_BATCH_INTERVAL_MS:50}
    replay:
      initial-delay-ms: ${GATEWAY_LEDGER_REPLAY_INITIAL_DELAY_MS:30000}
      interval-ms: ${GATEWAY_LEDGER_REPLAY_INTERVAL_MS:60000}
    shutdown-await-seconds: ${GATEWAY_LEDGER_SHUTDOWN_AWAIT_SECONDS:5}
    query:
      max-window-days: ${GATEWAY_LEDGER_QUERY_MAX_WINDOW_DAYS:90}
      max-page-size: ${GATEWAY_LEDGER_QUERY_MAX_PAGE_SIZE:100}
      default-page-size: ${GATEWAY_LEDGER_QUERY_DEFAULT_PAGE_SIZE:20}
  dashboard:
    # On-demand dashboard ceilings: views compute only when opened. Results stay
    # cached for result-ttl-minutes with newest-row watermarks; settled days
    # persist as lazy buckets once the day end plus grace-overlap-minutes passes.
    result-ttl-minutes: ${GATEWAY_DASHBOARD_RESULT_TTL_MINUTES:5}
    grace-overlap-minutes: ${GATEWAY_DASHBOARD_GRACE_OVERLAP_MINUTES:5}
    default-window-days: ${GATEWAY_DASHBOARD_DEFAULT_WINDOW_DAYS:7}
    statement-timeout-seconds: ${GATEWAY_DASHBOARD_STATEMENT_TIMEOUT_SECONDS:10}
    rate-limit-per-minute: ${GATEWAY_DASHBOARD_RATE_LIMIT_PER_MINUTE:30}
  circuit-breaker:
    redis-timeout: ${GATEWAY_CIRCUIT_BREAKER_REDIS_TIMEOUT:250ms}
  guardrails:
    mode: ${GATEWAY_GUARDRAILS_MODE:ENFORCE}
    secret-scanning-enabled: ${GATEWAY_GUARDRAILS_SECRET_SCANNING:true}
    pii-anonymization-enabled: ${GATEWAY_GUARDRAILS_PII_ANONYMIZATION:true}
    prompt-injection-defense-enabled: ${GATEWAY_GUARDRAILS_PROMPT_INJECTION:true}
    streaming-validation-enabled: ${GATEWAY_GUARDRAILS_STREAMING_VALIDATION:true}
    kill-switch-mode: ${GATEWAY_GUARDRAILS_KILL_SWITCH_MODE:TERMINATE_WITH_ERROR}
    system-prompt-exfiltration-defense-enabled: ${GATEWAY_GUARDRAILS_SYSTEM_PROMPT_DEFENSE:true}
    data-residency-enabled: ${GATEWAY_GUARDRAILS_DATA_RESIDENCY:true}
    default-residency-policy: ${GATEWAY_GUARDRAILS_DEFAULT_RESIDENCY_POLICY:STRICT_SOVEREIGN}
  mcp:
    # HITL AEAD secret — injected exclusively from the runtime environment.
    # NEVER hardcode a value here. Generate with: openssl rand -base64 32
    # Required: GATEWAY_MCP_HITL_SECRET=<32+ byte base64 or random string>
    # The application refuses to start if this is absent or shorter than 32 bytes.
    hitl-secret: ${GATEWAY_MCP_HITL_SECRET:}
    catalog-cache-maximum-size: ${GATEWAY_MCP_CATALOG_CACHE_MAXIMUM_SIZE:16}
    legacy-sse-emitter-timeout-minutes: ${GATEWAY_MCP_LEGACY_SSE_EMITTER_TIMEOUT_MINUTES:30}
    # Cap on one tools/call result body (PERF-11): larger upstream results fail with 502
    # instead of OOMing the heap. Override: GATEWAY_MCP_MAX_RESULT_BYTES.
    max-result-bytes: ${GATEWAY_MCP_MAX_RESULT_BYTES:1048576}
  a2a:
    # A2A agent proxy (slice 1): non-streaming JSON-RPC relay for operator-registered
    # upstream agents, with virtual-key auth + per-agent circuit breaking. The proxy is
    # inert until agents are registered below (or via external config).
    enabled: ${GATEWAY_A2A_ENABLED:true}
    # Public gateway base URL used to rewrite agent cards to the proxy address.
    public-base-url: ${GATEWAY_PUBLIC_BASE_URL:http://localhost:8080}
    max-request-bytes: ${GATEWAY_A2A_MAX_REQUEST_BYTES:1048576}
    max-result-bytes: ${GATEWAY_A2A_MAX_RESULT_BYTES:1048576}
    # agents:
    #   research-agent:
    #     base-url: "https://agents.internal/a2a"
    #     api-key: ${A2A_RESEARCH_AGENT_KEY:}

cacherelay:
  sse:
    flush:
      # Adaptive dual-trigger SSE flushing: a flush is issued when this many lines
      # are buffered or when this many milliseconds elapsed since the last flush,
      # whichever comes first. Batching keeps the flush syscall rate flat at
      # 1000+ req/min while bounding downstream latency.
      max-lines-per-flush: ${CACHERELAY_SSE_FLUSH_MAX_LINES_PER_FLUSH:16}
      # Tight interval for interactive TTFT (worst-case added latency 20ms).
      # The high-throughput profile deliberately keeps the looser 100ms record
      # default to favor fewer syscalls per stream at scale.
      max-interval-ms: ${CACHERELAY_SSE_FLUSH_MAX_INTERVAL_MS:20}
      # A flush slower than this counts as downstream backpressure; the stream is
      # aborted so the upstream exchange is cancelled instead of piling memory.
      flush-backpressure-threshold-ms: ${CACHERELAY_SSE_FLUSH_BACKPRESSURE_THRESHOLD_MS:500}
      # Per-connection cap on buffered-but-unflushed bytes; exceeding it aborts the
      # stream (guards against a malicious upstream flooding tiny lines).
      max-buffer-bytes: ${CACHERELAY_SSE_FLUSH_MAX_BUFFER_BYTES:65536}
      # Per-connection token-bucket cap on flush syscalls.
      max-flushes-per-second: ${CACHERELAY_SSE_FLUSH_MAX_FLUSHES_PER_SECOND:1000}
      enabled: ${CACHERELAY_SSE_FLUSH_ENABLED:true}
      # How often the hot-reload bridge re-binds this section from the Environment.
      # Not part of the flush record itself; read directly by the reloader.
      reload-interval: ${CACHERELAY_SSE_FLUSH_RELOAD_INTERVAL:30s}
    capacity:
      # Startup-only SSE ceilings (restart to apply): concurrent streams, registry
      # scan period, and watchdog timeout. Defaults serve light/moderate load; the
      # high-throughput profile raises max-connections for 50K-stream operation.
      max-connections: ${CACHERELAY_SSE_CAPACITY_MAX_CONNECTIONS:10000}
      tick-period-ms: ${CACHERELAY_SSE_CAPACITY_TICK_PERIOD_MS:10}
      watchdog-timeout-ms: ${CACHERELAY_SSE_CAPACITY_WATCHDOG_TIMEOUT_MS:30000}

management:
  server:
    # SEC-15: actuator endpoints live on a dedicated management port. Docker Compose
    # publishes it on host loopback only (never on the app bind host) and Prometheus
    # scrapes it over the compose network, so the anonymous metrics surface is never
    # reachable from the network. The app port serves no actuator endpoint at all.
    port: ${GATEWAY_MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jvm.gc.pause: true
        hikaricp.connections.acquire: true
    tags:
      application: CacheRelay
server:
  tomcat:
    mbeanregistry:
      enabled: true

# ==============================================================================
# SpringDoc OpenAPI 3.1 & Interactive Swagger UI Configuration
# ==============================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_1
    groups:
      enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls-primary-name: "1. Public Gateway APIs"
    doc-expansion: list
    try-it-out-enabled: true
    syntax-highlight:
      activated: true
      theme: monokai
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    display-operation-id: true
    filter: true
    persist-authorization: true
    default-models-expand-depth: 1
    default-model-rendering: example
    disable-swagger-default-url: true
    show-extensions: true
    show-common-extensions: true
  show-actuator: false