# promtool unit tests for cacherelay_alerts.yml.
# Run: docker run --rm -v <repo>/backend/monitoring/prometheus/rules:/rules prom/prometheus:v3.13.3 \
#        promtool test rules /rules/tests/cacherelay_alerts_test.yml
rule_files:
  - ../cacherelay_alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'pg_stat_database_numbackends{datname="cacherelay"}'
        values: 85+0x29
      - series: 'pg_settings_max_connections'
        values: 100+0x29
    alert_rule_test:
      - eval_time: 10m
        alertname: PostgresConnectionsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: data-infra
            exp_annotations:
              summary: "Postgres connections above 80% of max"
              description: "Connection pressure vs Hikari pool (10). Scale pool or investigate idle-in-transaction."

  - interval: 1m
    input_series:
      - series: 'pg_stat_database_numbackends{datname="cacherelay"}'
        values: 10+0x29
      - series: 'pg_stat_database_numbackends{datname="template0"}'
        values: 50+0x29
      - series: 'pg_stat_database_numbackends{datname="template1"}'
        values: 50+0x29
      - series: 'pg_settings_max_connections'
        values: 100+0x29
    alert_rule_test:
      - eval_time: 10m
        alertname: PostgresConnectionsHigh
        exp_alerts: [ ]

  - interval: 1m
    input_series:
      - series: 'cacherelay_ratelimit_evaluations_total{decision="allowed"}'
        values: 100+100x29
      - series: 'cacherelay_ratelimit_evaluations_total{decision="denied"}'
        values: 0+2x29
    alert_rule_test:
      - eval_time: 10m
        alertname: RateLimitDenySpike
        exp_alerts: [ ]

  - interval: 1m
    input_series:
      - series: 'cacherelay_ratelimit_evaluations_total{decision="allowed"}'
        values: 100+0x29
      - series: 'cacherelay_ratelimit_evaluations_total{decision="denied"}'
        values: 0+60x29
    alert_rule_test:
      - eval_time: 10m
        alertname: RateLimitDenySpike
        exp_alerts:
          - exp_labels:
              severity: warning
              team: security-ops
            exp_annotations:
              summary: "Rate-limit deny rate above 5%"
              description: "Clients are being throttled at 100%. Verify legitimate burst vs abuse."

  - interval: 1m
    input_series:
      - series: 'pg_stat_database_deadlocks{datname="cacherelay"}'
        values: 0+0x29
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresDeadlocks
        exp_alerts: [ ]

  - interval: 1m
    input_series:
      - series: 'pg_stat_database_deadlocks{datname="cacherelay"}'
        values: 0+0x9 0+0x9 1+0x9
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresDeadlocks
        exp_alerts:
          - exp_labels:
              datname: cacherelay
              severity: critical
              team: data-infra
            exp_annotations:
              summary: "Postgres deadlocks detected"
              description: "Deadlocks in the last hour on cacherelay. Inspect concurrent ledger writes."

  - interval: 1m
    input_series:
      - series: 'hikaricp_connections_active{pool="HikariPool-1"}'
        values: 9+0x29
      - series: 'hikaricp_connections_max{pool="HikariPool-1"}'
        values: 10+0x29
    alert_rule_test:
      - eval_time: 10m
        alertname: HikariPoolNearExhaustion
        exp_alerts:
          - exp_labels:
              pool: HikariPool-1
              severity: critical
              team: data-infra
            exp_annotations:
              summary: "HikariCP database pool utilization > 85%"
              description: "Database connection pool is nearly saturated on ."

  - interval: 1m
    input_series:
      - series: 'redis_evicted_keys_total{job="redis"}'
        values: 0+0x29
    alert_rule_test:
      - eval_time: 30m
        alertname: RedisEvictionsActive
        exp_alerts: [ ]

  - interval: 1m
    input_series:
      - series: 'redis_evicted_keys_total{job="redis"}'
        values: 0+0x9 5+0x19
    alert_rule_test:
      - eval_time: 30m
        alertname: RedisEvictionsActive
        exp_alerts:
          - exp_labels:
              job: redis
              severity: critical
              team: data-infra
            exp_annotations:
              summary: "Redis is evicting keys"
              description: "Evictions on a noeviction policy mean writes are failing. Add memory or reduce key churn."

  - interval: 1m
    input_series:
      - series: 'redis_evicted_keys_total{job="redis-cache"}'
        values: 0+0x9 50+0x19
    alert_rule_test:
      - eval_time: 30m
        alertname: RedisEvictionsActive
        exp_alerts: [ ]

  - interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{job="redis"}'
        values: 100000000+0x29
      - series: 'redis_memory_max_bytes{job="redis"}'
        values: 268435456+0x29
    alert_rule_test:
      - eval_time: 30m
        alertname: RedisMemoryPressure
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{job="redis"}'
        values: 100000000+5000000x29
      - series: 'redis_memory_max_bytes{job="redis"}'
        values: 268435456+0x29
    alert_rule_test:
      - eval_time: 30m
        alertname: RedisMemoryPressure
        exp_alerts:
          - exp_labels:
              job: redis
              severity: warning
              team: data-infra
            exp_annotations:
              summary: "Redis memory above 80% of maxmemory"
              description: "Redis holds pressure against its maxmemory cap. Evictions under noeviction fail writes."

  - interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{job="redis-cache"}'
        values: 240000000+500000x29
      - series: 'redis_memory_max_bytes{job="redis-cache"}'
        values: 268435456+0x29
    alert_rule_test:
      - eval_time: 30m
        alertname: RedisCacheMemoryPressure
        exp_alerts: [ ]

  - interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{job="redis-cache"}'
        values: 240000000+500000x29
      - series: 'redis_memory_max_bytes{job="redis-cache"}'
        values: 256000000+0x29
    alert_rule_test:
      - eval_time: 30m
        alertname: RedisCacheMemoryPressure
        exp_alerts:
          - exp_labels:
              job: redis-cache
              severity: warning
              team: data-infra
            exp_annotations:
              summary: "Redis cache memory above 95% of maxmemory"
              description: "Cache tier nearly full: hit ratio will decay. Evictions are normal here; add memory if the hit ratio drops."

  - interval: 1m
    input_series:
      - series: 'cacherelay_ledger_dead_letter_skip_total{provider="openai"}'
        values: 0+0x29
    alert_rule_test:
      - eval_time: 10m
        alertname: LedgerDeadLetterSkip
        exp_alerts: [ ]

  - interval: 1m
    input_series:
      - series: 'cacherelay_ledger_dead_letter_skip_total{provider="openai"}'
        values: 0+1x29
    alert_rule_test:
      - eval_time: 10m
        alertname: LedgerDeadLetterSkip
        exp_alerts:
          - exp_labels:
              provider: openai
              severity: critical
              team: billing-ops
            exp_annotations:
              summary: "Spillway replay failures preserving records as dead letters"
              description: "Replay consumers rejected journal records; every record is preserved durably. Investigate the downstream outage before the dead-letter backlog grows."

  - interval: 1m
    input_series:
      - series: 'jvm_buffer_memory_used_bytes{id="direct"}'
        values: 230000000+0x29
    alert_rule_test:
      - eval_time: 10m
        alertname: JvmDirectMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform-core
              id: direct
            exp_annotations:
              summary: "JVM direct memory above 80% of the 256m cap"
              description: "Netty/Lettuce pooled buffers near MaxDirectMemorySize; exhaustion OOMs without ExitOnOutOfMemoryError (JDK-8257790). Denominator tracks the Dockerfile cap — update together."

  - interval: 1m
    input_series:
      - series: 'jvm_memory_used_bytes{area="heap"}'
        values: 1100000000+0x29
      - series: 'jvm_memory_max_bytes{area="heap"}'
        values: 1200000000+0x29
    alert_rule_test:
      - eval_time: 10m
        alertname: JvmHeapPressureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform-core
            exp_annotations:
              summary: "JVM heap above 90% sustained"
              description: "Heap pressure near Xmx; expect ZGC allocation pacing then OOM. Correlate with GcPauseHigh."
